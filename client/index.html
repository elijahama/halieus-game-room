<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Halieus Game Room</title>
    <meta
      name="description"
      content="Halieus Game Room is a private multiplayer space for playing board and card games with friends."
    />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="application-name" content="Halieus Game Room" />
    <meta name="apple-mobile-web-app-title" content="Halieus Game Room" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#e5a721" />
    <script>
      // Apply the saved palette before the app/CSS bundle paints so a hard reload
      // never flashes the opposite theme. React takes over this state after mount.
      (() => {
        try {
          const saved = localStorage.getItem("halieus-game-room-theme");
          const mode = saved === "system" || saved === "light" || saved === "dark" || saved === "blue" || saved === "red" || saved === "green" || saved === "profile" || saved === "custom"
            ? saved
            : "system";
          const systemTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          const theme = mode === "system" ? systemTheme : mode;
          const profileId = localStorage.getItem("halieus-game-room-theme-profile") || "blue-circuit";
          const profileBoot = {
            "blue-circuit": ["#050b14", "#258dff", "dark"],
            "redline": ["#12080b", "#e03b46", "dark"],
            "emerald-arcade": ["#07110c", "#3ccf78", "dark"],
            "ultraviolet": ["#0c0814", "#9558ff", "dark"],
            "neon-grid": ["#05090b", "#00c9d8", "dark"],
            "brass-coal": ["#11100e", "#c98a2f", "dark"],
            "terminal": ["#050705", "#4de06f", "dark"],
            "solar-dusk": ["#140b12", "#f07b32", "dark"],
            "icebox": ["#0a1117", "#74bfff", "dark"],
            "cream-soda": ["#eee7d8", "#a75d28", "light"],
            "midnight-rose": ["#10090d", "#c84d78", "dark"],
            "deep-ocean": ["#041013", "#159f9d", "dark"],
          };
          const profile = profileBoot[profileId] || profileBoot["blue-circuit"];
          let background = theme === "light" ? "#f4f5f7" : theme === "blue" ? "#06111c" : theme === "red" ? "#170d10" : theme === "green" ? "#0d1712" : theme === "profile" ? profile[0] : "#0f1012";
          let accent = theme === "blue" ? "#267cc5" : theme === "red" ? "#c9444d" : theme === "green" ? "#428e59" : theme === "profile" ? profile[1] : "#d6a11f";
          let scheme = theme === "light" ? "light" : theme === "profile" ? profile[2] : "dark";
          if (theme === "custom") {
            try {
              const custom = JSON.parse(localStorage.getItem("halieus-game-room-custom-theme") || "{}");
              if (/^#[0-9a-f]{6}$/i.test(custom.page || "")) background = custom.page;
              if (/^#[0-9a-f]{6}$/i.test(custom.accent || "")) accent = custom.accent;
              if (background) {
                const rgb = background.slice(1).match(/.{2}/g)?.map((part) => parseInt(part, 16)) || [0,0,0];
                scheme = (rgb[0] * .299 + rgb[1] * .587 + rgb[2] * .114) > 165 ? "light" : "dark";
              }
            } catch {}
          }
          document.documentElement.dataset.themeMode = mode;
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themeProfile = profileId;
          document.documentElement.dataset.textScale = localStorage.getItem("halieus-game-room-text-scale") || "standard";
          document.documentElement.dataset.density = localStorage.getItem("halieus-game-room-density") || "standard";
          document.documentElement.style.colorScheme = scheme;
          document.documentElement.style.backgroundColor = background;
          document.documentElement.style.setProperty("--boot-bg", background);
          document.documentElement.style.setProperty("--boot-accent", accent);
          const themeMeta = document.querySelector('meta[name="theme-color"]');
          themeMeta?.setAttribute("content", background);
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.backgroundColor = "#101317";
        }
      })();
    </script>
    <style id="halieus-first-paint">
      /* The browser paints HTML before the bundled stylesheet arrives. Keep the
         document canvas on the saved Halieus palette during that gap so reloads
         never expose the browser's default white page. */
      html, body, #root { margin: 0; width: 100%; min-height: 100%; }
      html, body, #root { background-color: var(--boot-bg, #0f1012); }
      html[data-theme="light"],
      html[data-theme="light"] body,
      html[data-theme="light"] #root { background-color: var(--boot-bg, #f4f7fb); }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root { background-color: var(--boot-bg, #0f1012); }
      #root { min-height: 100vh; }

      /* A real first-paint layer, not a React loading screen. It is present in
         the HTML response itself and therefore covers bundle/auth network time. */
      #halieus-boot-curtain {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--boot-accent, #e5a721) 13%, transparent), transparent 28%),
          var(--boot-bg, #0f1012);
        opacity: 1;
        transition: opacity 420ms cubic-bezier(.22,.61,.36,1), visibility 420ms linear;
      }
      html[data-theme="light"] #halieus-boot-curtain {
        background:
          radial-gradient(circle at 50% 42%, rgba(181,126,17,.14), transparent 28%),
          #f0e8da;
      }
      #halieus-boot-curtain::before {
        content: "";
        position: absolute;
        width: min(58vw, 520px);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 1px solid rgba(229,167,33,.09);
        box-shadow: 0 0 90px rgba(229,167,33,.055) inset;
        animation: halieus-boot-orbit 6s linear infinite;
      }
      .halieus-boot-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 62px;
        height: 62px;
        border: 1px solid rgba(229,167,33,.32);
        border-radius: 19px;
        background: rgba(13,16,20,.74);
        color: var(--boot-accent, #e5a721);
        box-shadow: 0 18px 55px rgba(0,0,0,.18), 0 0 34px rgba(229,167,33,.10);
        font: 950 32px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: -.08em;
        text-indent: -.08em;
        animation: halieus-boot-breathe 1.8s ease-in-out infinite;
      }
      html[data-theme="light"] .halieus-boot-mark {
        background: rgba(255,252,246,.78);
        box-shadow: 0 16px 40px rgba(97,69,18,.10), 0 0 32px rgba(181,126,17,.08);
      }
      #halieus-boot-curtain.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; }
      @keyframes halieus-boot-breathe { 0%,100% { transform: scale(.985); opacity:.82; } 50% { transform: scale(1); opacity:1; } }
      @keyframes halieus-boot-orbit { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #halieus-boot-curtain, .halieus-boot-mark, #halieus-boot-curtain::before { animation: none !important; transition-duration: 0ms !important; }
      }
    </style>
