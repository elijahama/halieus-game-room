name: HGR release identity

on:
  push:
    branches:
      - main
    paths-ignore:
      - RELEASE.json
      - shared/release.ts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hgr-release-identity-main
  cancel-in-progress: false

jobs:
  updater-windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out HGR updater
        uses: actions/checkout@v5
      - name: Exercise real Windows CMD repush and renamed origin
        run: node tests/runtime-updater-cmd-smoke.mjs
      - name: Validate six actual Windows launcher shortcuts and approved artwork
        run: node tests/regression-part26-control-launcher-hardening.mjs

  refresh-release-identity:
    needs: updater-windows-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_sha: ${{ steps.publish.outputs.release_sha }}
      source_hash: ${{ steps.publish.outputs.source_hash }}
    steps:
      - name: Check out exact triggering main revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Parse deployment and Windows launcher helpers
        shell: pwsh
        run: |
          $scripts = @(
            './tests/dev-tools/Oracle Quick Deploy/deploy-from-windows.ps1',
            './scripts/windows/generate-launcher-icons.ps1',
            './scripts/windows/launcher-shortcuts.ps1',
            './scripts/windows/refresh-control-after-update.ps1',
            './scripts/windows/control-update.ps1',
            './scripts/windows/control-update-isolated-main.ps1',
            './scripts/windows/control-update-finalize.ps1',
            './scripts/windows/post-update-client.ps1',
            './scripts/windows/start-control.ps1',
            './scripts/windows/stop-control.ps1',
            './scripts/windows/start-control-cloud.ps1',
            './scripts/windows/stop-control-cloud.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell syntax failed: $script"
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host "PowerShell syntax PASS: $script"
          }

      - name: Install HGR workspace dependencies
        run: npm ci

      - name: Install canonical identity renderer
        run: npx playwright install chromium

      - name: Regenerate canonical main HGR identity assets
        run: node scripts/generate-platform-icons.mjs

      - name: Generate canonical version artifacts before checks
        run: npm run prepare:release

      - name: Pin identity for Linux validation
        id: pinned
        shell: bash
        run: |
          echo "source_hash=$(node -p \"require('./RELEASE.json').sourceHash\")" >> "$GITHUB_OUTPUT"

      - name: Typecheck current HGR source
        run: npm run typecheck

      - name: Control preflight - Control polish and offline cache
        timeout-minutes: 8
        run: node tests/browser-control-polish.mjs

      - name: Control preflight - Control operation replay
        timeout-minutes: 5
        run: node tests/browser-control-operation-replay-4.5.5y.mjs

      - name: Run HGR regression chain
        run: npm run test:regression

      - name: Validate tournament ratings and HGR-wide replay archive foundation
        run: npm run test:replays:all

      - name: Reproduce owner Cloud Update deferred-Control regression environment
        env:
          HGR_CONTROL_DEFER_REFRESH: "1"
          HGR_UPDATE_NONINTERACTIVE: "1"
        run: node tests/runtime-control-lifecycle.mjs

      - name: Enforce npm high/critical security gate
        run: npm audit --audit-level=high

      - name: Generate exact HGR release identity
        run: npm run prepare:release

      - name: Build current HGR release
        run: npm run build

      - name: Verify Daily Word anti-farming in real sockets
        run: node tests/runtime-daily-word-fair-play-4.5.5e.mjs

      - name: Browser gate 1/14 - Push enrollment
        timeout-minutes: 5
        run: node tests/browser-push-enrollment-4.5.5v.mjs

      - name: Browser gate 2/14 - Guild add friend
        timeout-minutes: 5
        run: node tests/browser-guild-add-friend-4.5.5w.mjs

      - name: Browser gate 3/14 - Mega Board spectator layout
        timeout-minutes: 5
        run: node tests/browser-mega-spectator-layout-4.5.5x.mjs

      - name: Browser gate 4/14 - Mega Board portrait
        timeout-minutes: 5
        run: npm run test:browser:mega-portrait

      - name: Browser gate 5/14 - Mega Board compact layout
        timeout-minutes: 5
        run: npm run test:browser:mega-compact

      - name: Browser gate 6/14 - Built release identity
        timeout-minutes: 5
        run: npm run test:release:browser

      - name: Browser gate 7/14 - Theme atmosphere
        timeout-minutes: 5
        run: node tests/browser-theme-atmosphere.mjs

      - name: Browser gate 8/14 - Mega Board portfolio
        timeout-minutes: 5
        run: node tests/browser-mega-board-portfolio.mjs

      - name: Browser gate 9/14 - Mega Board auction
        timeout-minutes: 5
        run: node tests/browser-mega-auction-real-react.mjs

      - name: Browser gate 10/14 - Mobile lobby and Test Lab
        timeout-minutes: 5
        run: node tests/browser-mobile-lobby-testlab-layout.mjs

      - name: Browser gate 11/14 - Mega Board mobile overlays
        timeout-minutes: 5
        run: npm run test:browser:mega-mobile-overlays

      - name: Browser gate 12/14 - Mega Board mobile integration
        timeout-minutes: 5
        run: npm run test:browser:mobile-integration

      - name: Browser gate 13/14 - Control state
        timeout-minutes: 5
        run: node tests/browser-control-state.mjs

      - name: Browser gate 14/14 - Control branding
        timeout-minutes: 5
        run: node tests/browser-control-branding.mjs


      - name: Commit generated release identity when changed
        id: publish
        shell: bash
        env:
          VALIDATED_SOURCE_HASH: ${{ steps.pinned.outputs.source_hash }}
        run: |
          node scripts/release-integrity.mjs --verify
          SOURCE_HASH=$(node -p "require('./RELEASE.json').sourceHash")
          if [[ ! "$SOURCE_HASH" =~ ^[a-f0-9]{64}$ || "$SOURCE_HASH" != "$VALIDATED_SOURCE_HASH" ]]; then
            echo "::error::Release identity changed during Linux validation."
            exit 1
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Main changed during packaging; refusing to publish stale release identity."
            exit 1
          fi
          if git diff --quiet -- RELEASE.json shared/release.ts VERSION package.json package-lock.json client/package.json server/package.json shared/package.json desktop/package.json shared/version.ts client/index.html client/src/App.tsx client/public/site.webmanifest client/public/control/index.html client/public/sw.js client/public/app-icon-180.png client/public/app-icon-192.png client/public/app-icon-512.png client/public/halieus-app-icon.png client/public/favicon-32.png client/public/favicon.ico client/public/identity-artwork.json "assets/Halieus Game Room.png" "assets/Halieus Game Room.ico" assets/app-icon.png "assets/branding/Halieus Game Room.png" "assets/branding/Halieus Game Room.ico" "assets/branding/references/HGR Main.png" "desktop/assets/Halieus Game Room.png" "desktop/assets/Halieus Game Room.ico" "server/Halieus Game Room.png" "server/Halieus Game Room.ico" "server/assets/branding/Halieus Game Room.png" "server/assets/branding/Halieus Game Room.ico" README.md; then
            echo "Release identity is already current."
            git diff --quiet HEAD -- .
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "source_hash=$SOURCE_HASH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "HGR Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add RELEASE.json shared/release.ts VERSION package.json package-lock.json client/package.json server/package.json shared/package.json desktop/package.json shared/version.ts client/index.html client/src/App.tsx client/public/site.webmanifest client/public/control/index.html client/public/sw.js client/public/app-icon-180.png client/public/app-icon-192.png client/public/app-icon-512.png client/public/halieus-app-icon.png client/public/favicon-32.png client/public/favicon.ico client/public/identity-artwork.json "assets/Halieus Game Room.png" "assets/Halieus Game Room.ico" assets/app-icon.png "assets/branding/Halieus Game Room.png" "assets/branding/Halieus Game Room.ico" "assets/branding/references/HGR Main.png" "desktop/assets/Halieus Game Room.png" "desktop/assets/Halieus Game Room.ico" "server/Halieus Game Room.png" "server/Halieus Game Room.ico" "server/assets/branding/Halieus Game Room.png" "server/assets/branding/Halieus Game Room.ico" README.md
          git commit -m "chore: refresh HGR release identity"
          git diff --quiet HEAD -- .
          node scripts/release-integrity.mjs --verify
          git push origin HEAD:main
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_hash=$SOURCE_HASH" >> "$GITHUB_OUTPUT"

  # Additional proof for the OPTIONAL fast path. Normal release publication
  # still uses the existing Windows smoke + Linux gates above. No shortcut
  # is eligible until this exact published commit passes full Windows checks.
  updater-windows-full-validation:
    needs: refresh-release-identity
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.refresh-release-identity.outputs.release_sha }}
      VALIDATED_SOURCE_HASH: ${{ needs.refresh-release-identity.outputs.source_hash }}
      HGR_UPDATE_NONINTERACTIVE: "1"
      HGR_CONTROL_DEFER_REFRESH: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.refresh-release-identity.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify the exact generated release before Windows checks
        shell: pwsh
        run: |
          if ($env:RELEASE_SHA -notmatch '^[a-f0-9]{40}$' -or $env:VALIDATED_SOURCE_HASH -notmatch '^[a-f0-9]{64}$') { throw "Invalid pinned release identity" }
          if ((git rev-parse HEAD).Trim() -cne $env:RELEASE_SHA) { throw "Wrong release checkout" }
          node scripts/release-integrity.mjs --verify
          if ($LASTEXITCODE -ne 0) { throw "Release integrity failed" }
          if ((Get-Content RELEASE.json -Raw | ConvertFrom-Json).sourceHash -cne $env:VALIDATED_SOURCE_HASH) { throw "Wrong release source hash" }
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install chromium
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:regression
      - name: Real package preflight without SSH
        shell: powershell
        run: |
          & ./tests/package-oracle-4.0.0.ps1
      - name: Recheck exact identity after Windows checks
        shell: pwsh
        run: |
          node scripts/release-integrity.mjs --verify
          if ($LASTEXITCODE -ne 0) { throw "Release integrity failed" }
          if ((Get-Content RELEASE.json -Raw | ConvertFrom-Json).sourceHash -cne $env:VALIDATED_SOURCE_HASH) { throw "Validated source hash changed" }
          git diff --quiet HEAD -- .
          if ($LASTEXITCODE -ne 0) { throw "Tracked release bytes changed during validation" }

  publish-fast-path-receipt:
    needs: [refresh-release-identity, updater-windows-full-validation]
    if: github.repository == 'elijahama/halieus-game-room' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.refresh-release-identity.outputs.release_sha }}
      SOURCE_HASH: ${{ needs.refresh-release-identity.outputs.source_hash }}
    steps:
      - name: Publish exact release validation status
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_HASH" =~ ^[a-f0-9]{64}$ ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$RELEASE_SHA" ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" \
            -f state=success \
            -f context=hgr/validated-release-v1 \
            -f "description=sha256:$SOURCE_HASH" \
            -f "target_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" >/dev/null
