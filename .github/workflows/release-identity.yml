name: HGR release identity

on:
  push:
    branches:
      - main
    paths-ignore:
      - RELEASE.json
      - shared/release.ts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hgr-release-identity-main
  cancel-in-progress: false

jobs:
  refresh-release-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse Oracle deployment helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './tests/dev-tools/Oracle Quick Deploy/deploy-from-windows.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'Oracle deployment helper PowerShell syntax: PASS'

      - name: Generate canonical version artifacts before checks
        run: npm run prepare:release

      - name: Install HGR workspace dependencies
        run: npm ci

      - name: Typecheck current HGR source
        run: npm run typecheck

      - name: Run HGR regression chain
        run: npm run test:regression

      - name: Generate exact HGR release identity
        run: npm run prepare:release

      - name: Build current HGR release
        run: npm run build

      - name: Check built release identity
        run: |
          npx playwright install --with-deps chromium
          npm run test:release:browser

      - name: Commit generated release identity when changed
        shell: bash
        run: |
          if git diff --quiet -- RELEASE.json shared/release.ts VERSION package.json package-lock.json client/package.json server/package.json shared/package.json desktop/package.json shared/version.ts client/index.html client/src/App.tsx client/public/site.webmanifest client/public/sw.js README.md; then
            echo "Release identity is already current."
            exit 0
          fi

          git config user.name "HGR Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add RELEASE.json shared/release.ts VERSION package.json package-lock.json client/package.json server/package.json shared/package.json desktop/package.json shared/version.ts client/index.html client/src/App.tsx client/public/site.webmanifest client/public/sw.js README.md
          git commit -m "chore: refresh HGR release identity"
          git push origin HEAD:main
