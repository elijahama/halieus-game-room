name: HGR release identity

on:
  push:
    branches:
      - main
    paths-ignore:
      - RELEASE.json
      - shared/release.ts
      - .github/debug/typecheck-failure.txt
      - .github/debug/regression-failure.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hgr-release-identity-main
  cancel-in-progress: false

jobs:
  refresh-release-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse Oracle deployment helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './tests/dev-tools/Oracle Quick Deploy/deploy-from-windows.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'Oracle deployment helper PowerShell syntax: PASS'

      - name: Install HGR workspace dependencies
        run: npm ci

      - name: Typecheck current HGR source
        id: typecheck
        continue-on-error: true
        shell: bash
        run: npm run typecheck 2>&1 | tee typecheck-failure.txt

      - name: Publish typecheck failure for repair
        if: steps.typecheck.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p .github/debug
          cp typecheck-failure.txt .github/debug/typecheck-failure.txt
          git config user.name "HGR Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/debug/typecheck-failure.txt
          git commit -m "ci: capture typecheck failure"
          git push origin HEAD:main
          exit 1

      - name: Run HGR regression chain
        id: regression
        continue-on-error: true
        shell: bash
        run: npm run test:regression 2>&1 | tee regression-failure.txt

      - name: Publish regression failure for repair
        if: steps.regression.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p .github/debug
          cp regression-failure.txt .github/debug/regression-failure.txt
          git config user.name "HGR Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/debug/regression-failure.txt
          git commit -m "ci: capture regression failure"
          git push origin HEAD:main
          exit 1

      - name: Generate exact HGR release identity
        run: npm run prepare:release

      - name: Commit generated release identity when changed
        shell: bash
        run: |
          if git diff --quiet -- RELEASE.json shared/release.ts; then
            echo "Release identity is already current."
            exit 0
          fi

          git config user.name "HGR Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add RELEASE.json shared/release.ts
          git commit -m "chore: refresh HGR release identity"
          git push origin HEAD:main
