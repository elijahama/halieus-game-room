name: HGR pull request validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate public GitHub names for newly opened PRs
        run: node scripts/check-public-github-naming.mjs
      - name: Regression test the naming guard
        run: node tests/runtime-public-github-naming.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run prepare:release
      - run: npm run typecheck
      - run: npm run test:regression
      - run: npm run test:progression:refresh
      - run: npm run test:social:activity
      - run: npm run test:public:maintenance
      - run: npm run test:guild:fixtures
      - run: npm run test:beta:tournament
      - run: npm run test:control:background
      - run: npm run test:control:actions
      - run: npm run test:control:public-access
      - run: npm run test:browser:public-maintenance
      - run: npm run test:browser:control:window-operations
      - run: npm run test:replays:all
      - run: npm run test:feedback:notifications
      - run: npm run test:history
      - run: npm run test:browser:history
      - run: npm run test:active-match
      - run: npm run test:browser:active-match
      - run: npm run test:browser:discovery-portrait
      - run: npm run test:browser:gallery-all
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run test:browser:mobile-lobby
      - run: npm run test:browser:mega-mobile-overlays
      - run: npm run test:browser:mobile-integration
      - run: npm run test:browser:mega-auction
      - run: npm run test:browser:mega-spectator
      - run: npm run test:browser:mega-portrait
      - run: npm run test:browser:mega-compact
      - run: npm run test:browser:mega-replay
      - run: npm run test:release:browser
      - run: npm run validate:release
