name: Temporary Oracle audit lock refresh

on:
  push:
    branches:
      - fix/oracle-audit-gate-2026-10-06

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oracle-audit-gate-2026-10-06
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the audited overrides
        id: gate
        shell: bash
        run: |
          if grep -q '"proxy-addr": "2.0.8"' package.json && grep -q '"source-map-js": "1.2.2"' package.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply npm audit fixes to lockfile
        if: steps.gate.outputs.ready == 'true'
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Validate clean install
        if: steps.gate.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - name: Enforce high/critical audit gate
        if: steps.gate.outputs.ready == 'true'
        run: npm audit --audit-level=high
      - name: Commit refreshed lockfile
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches the audited fixes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): refresh audited dependency lock"
          git push origin HEAD:fix/oracle-audit-gate-2026-10-06
