name: Temporary Oracle Masterbook documentation patch

on:
  push:
    branches:
      - fix/oracle-audit-gate-2026-10-06

permissions:
  contents: write

jobs:
  patch-masterbook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oracle-audit-gate-2026-10-06
      - name: Patch Masterbook once
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/HGR_MASTERBOOK.md')
          text = path.read_text(encoding='utf-8')
          marker = '### Deployment security gate'
          if marker in text:
              print('Masterbook already contains deployment security gate.')
              raise SystemExit(0)
          needle = 'Historical documentation may refer to the patch in which a feature was introduced. Executable “current version” assumptions should not.\n\n'
          addition = (
              '### Deployment security gate\n\n'
              'Production deployment and release CI intentionally share the high/critical npm audit gate. '
              'A high or critical advisory blocks activation by design; remediation is to patch or override the affected dependency and refresh the lockfile, never to bypass or lower the gate. '
              'Operational recovery details live in [Deployment](DEPLOYMENT.md).\n\n'
          )
          if needle not in text:
              raise SystemExit('Expected Release engineering anchor not found; refusing to patch.')
          path.write_text(text.replace(needle, needle + addition, 1), encoding='utf-8')
      - name: Commit Masterbook patch
        shell: bash
        run: |
          if git diff --quiet -- docs/HGR_MASTERBOOK.md; then
            echo "No Masterbook change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HGR_MASTERBOOK.md
          git commit -m "docs: record deployment audit gate in Masterbook"
          git push origin HEAD:fix/oracle-audit-gate-2026-10-06
